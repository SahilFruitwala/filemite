<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Filemite</title>
<style>
  :root{color-scheme:light dark;--bg:#fbf8f2;--fg:#1f1b16}
  @media (prefers-color-scheme:dark){:root{--bg:#151311;--fg:#f3eee6}}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;text-align:center}
  img{width:72px;height:72px;border-radius:18px}
  h1{font-size:1.4rem;margin:16px 0 8px}
  p{margin:0 0 20px;opacity:.75;max-width:32ch}
  button{font:inherit;padding:10px 18px;border-radius:10px;border:0;background:var(--fg);color:var(--bg);cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/logo.svg" alt="">
  <h1>You're offline</h1>
  <p>This page hasn't been saved for offline use yet. Reconnect and try again.</p>
  <button onclick="location.reload()">Retry</button>
</main>
</body>
</html>
